workflows:
  test:
    when:
      event: check_suite.requested
    pipeline:
      check:
        image: debian:bookworm-slim
        resources:
          cpu: 2000
          memory: 1000
        commands:
          - apt-get update -qq
          - apt-get install -y -qq --no-install-recommends cmake make gcc g++ pkg-config libglib2.0-dev libsndfile1-dev
          - cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -Denable-oss=off
          - make -C build-native -j"$(nproc)" check

  build:
    when:
      event: push
    pipeline:
      wasm:
        image: emscripten/emsdk:3.1.10
        artifacts: "${stepName}.md"
        resources:
          cpu: 4000
          memory: 2000
        commands:
          - apt-get update -qq
          - apt-get install -y -qq --no-install-recommends autoconf automake libtool pkg-config wget xz-utils ca-certificates
          - ./build_libsndfile.sh
          - ./build.sh
          - cp -r dist /var/www/
          - ls -l dist | awk -v link="$BUILDERR_ARTIFACTS_LINK" 'NR>1 {printf "- [%s](%s/dist/%s) %d bytes\n", $9, link, $9, $5}' > /var/www/wasm.md

      smoke:
        image: node:22-slim
        commands:
          - node test/wasm/smoke.mjs

      publish:
        when:
          branch: main
        # Not node:*: a Vault secret keyed on that image name overrides NPM_TOKEN with a stale value.
        image: hub-eu.terra.songsterr.com/builderr-npm-24-slim
        commands:
          - ./publish.sh
